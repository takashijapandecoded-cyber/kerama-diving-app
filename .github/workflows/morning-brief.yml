name: 毎朝5時 ダイビングコンディション通知

on:
  # cron-job.org が毎朝5時JST(UTC 20:00)に workflow_dispatch で呼び出す
  # GitHub schedule は cron-job.org と二重起動になるため削除
  workflow_dispatch:
    inputs:
      test_email:
        description: 'テスト送信先メール（省略時はTO_EMAILへ）'
        required: false
        default: ''

permissions:
  contents: write  # スコア履歴CSVを自動コミットするため（読み取りのみのreadから変更）

jobs:
  send-morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Node.js 20は2026/06/16廃止のため22に更新

      - name: 依存パッケージをインストール
        working-directory: notify
        run: npm install

      # 毎朝ここで走らせる意味: 気象庁側で市町村コードや配信書式が変わった場合、
      # コードを一切触っとらんくても壊れる。その日の実データに対して毎朝検証する。
      #
      # ここで即失敗させるとメールが1通も届かず、優くんには理由も伝わらん（ただの無音）。
      # そのため結果だけ記録して先へ進み、送信ステップが「縮退メール」に切り替える。
      # ジョブ自体は最後のステップで失敗させ、GitHub上では赤く残す
      - name: 安全ロジックの回帰テスト
        id: safety_tests
        continue-on-error: true
        run: node --test tests/safety.test.mjs

      - name: 朝のサマリーをメール送信
        working-directory: notify
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL:           ${{ secrets.TO_EMAIL }}
          TEST_EMAIL:         ${{ github.event.inputs.test_email }}
          APP_URL:            ${{ secrets.APP_URL }}
          # 落ちとる場合は数字を一切出さん縮退メールに切り替わる
          SAFETY_TESTS_FAILED: ${{ steps.safety_tests.outcome == 'failure' && '1' || '0' }}
        run: node daily-brief.js

      # テストが落ちとる日は数字を信用できんので履歴に残さない
      - name: スコア履歴CSVをコミット
        if: steps.safety_tests.outcome == 'success'
        working-directory: notify
        run: |
          if [ -n "$(git status --porcelain score-history.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add score-history.csv
            git commit -m "記録: $(TZ=Asia/Tokyo date +%Y-%m-%d) のスコア履歴"  # CSVの行はJST基準。-u（UTC）だと1日ずれる
            git push || echo "⚠️ push失敗（他の変更と衝突した可能性。次回に持ち越し）"
          else
            echo "スコア履歴に変更なし（DRY_RUN、または本日分は記録済み）"
          fi

      # 縮退メールは送った上で、ジョブは失敗として記録する（気づかれずに放置されんように）
      - name: 回帰テストが落ちとったらジョブを失敗させる
        if: steps.safety_tests.outcome == 'failure'
        run: |
          echo "::error::回帰テストが失敗しました。優くんには縮退メールを送信済みです。上の『安全ロジックの回帰テスト』のログを確認してください。"
          exit 1
